<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--[cite: 14] -->
    <title>Inscripción de equipos | GGspolHUB</title>
    <link rel="icon" href="../img/icon/Kangaskhan.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100"> <!--[cite: 14] -->
    
    <header class="bg-dark text-white p-3 mb-4 shadow-sm"> <!--[cite: 13] -->
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0">GGspol Hub</h1>
            <nav>
                <a href="index.html" class="text-white text-decoration-none">⬅ Volver al Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container flex-grow-1"> <!--[cite: 13] -->
        <section class="card shadow p-4 card-hover">
            <h2 class="mb-4">Registrar Equipo en Torneo</h2>
            
            <form id="form-inscripcion">
                <!-- Datos generales del equipo -->
                <fieldset class="mb-4 border p-3 rounded"> <!--[cite: 10] -->
                    <legend class="w-auto px-2 h5">Datos del Equipo</legend>
                    <div class="mb-3">
                        <label for="nombreEquipo" class="form-label">Nombre del Equipo:</label>
                        <input type="text" id="nombreEquipo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="facultadEquipo" class="form-label">Facultad Representante:</label>
                        <select id="facultadEquipo" class="form-select" required></select> <!--[cite: 10] -->
                    </div>
                    <div class="mb-3">
                        <label for="torneoSelect" class="form-label">Seleccionar Torneo Activo:</label>
                        <select id="torneoSelect" class="form-select" required></select>
                    </div>
                </fieldset>
                
                <!-- Roster de jugadores -->
                <fieldset class="mb-4 border p-3 rounded"> <!--[cite: 10] -->
                    <legend class="w-auto px-2 h5">Roster (Jugadores)</legend>
                    <p class="text-muted small">Ingresa el Alias de los jugadores. Mínimo 1 capitán requerido.</p>
                    <div class="mb-2">
                        <input type="text" class="form-control" placeholder="Jugador 1 (Capitán) - Alias" required>
                    </div>
                    <div class="mb-2">
                        <input type="text" class="form-control" placeholder="Jugador 2 - Alias">
                    </div>
                    <div class="mb-2">
                        <input type="text" class="form-control" placeholder="Jugador 3 - Alias">
                    </div>
                </fieldset>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success primary-btn w-75">Guardar Inscripción</button>
                    <!-- Botón para limpiar los datos ingresados[cite: 10] -->
                    <button type="reset" class="btn btn-outline-danger w-25">Limpiar</button> 
                </div>
            </form>
        </section>
    </main>
    
    <footer class="text-center mt-5 p-3 bg-white text-muted border-top"> <!--[cite: 13] -->
        <p>© 2026 GGspol Hub - Módulo de Inscripciones</p>
    </footer>

    <script src="js/datos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Llenar select de Facultades dinámicamente desde el catálogo
            const selectFacultad = document.getElementById('facultadEquipo');
            catalogos.facultades.forEach(fac => {
                selectFacultad.innerHTML += `<option value="${fac.siglas}">${fac.nombre} (${fac.siglas})</option>`;
            });
            
            // Llenar select de Torneos filtrando solo los que están en estado "Inscripciones"
            const selectTorneo = document.getElementById('torneoSelect');
            const torneos = JSON.parse(localStorage.getItem('ggspol_torneos')) || datosIniciales.torneos;
            torneos.filter(t => t.estado === 'Inscripciones').forEach(t => {
                selectTorneo.innerHTML += `<option value="${t.id}">${t.nombre} - ${t.juego}</option>`;
            });
        });

        document.getElementById('form-inscripcion').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('¡Equipo registrado exitosamente! Validando datos locales...');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
