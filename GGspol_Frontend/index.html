<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de la comunidad | GGspolHUB</title>
    <link rel="icon" href="../img/icon/Pikachu.ico" type="image/x-icon">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <header class="bg-dark text-white p-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0">GGspol Hub</h1>
            <nav>
                <span class="badge bg-primary">Rol: Administrador (Simulado)</span>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Módulo M05: Historial y Estadísticas -->
        <section class="mb-5">
            <h2 class="h4 mb-3">Estadísticas por Facultad</h2>
            <div class="row" id="contenedor-estadisticas">
                <!-- Se llena con JS -->
            </div>
        </section>

        <hr>

        <!-- Módulo M03: Gestión de Torneos -->
        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4">Torneos Activos</h2>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalTorneo">Crear Torneo</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Torneo</th>
                            <th>Juego</th>
                            <th>Modalidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-torneos">
                        <!-- Se llena con JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal para Crear Torneo -->
    <div class="modal fade" id="modalTorneo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Configurar Nuevo Torneo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-crear-torneo">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Torneo</label>
                            <input type="text" id="nombreTorneo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Videojuego</label>
                            <select id="juegoTorneo" class="form-select" required>
                                <!-- Se llena desde datos.js -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Modalidad</label>
                            <select id="modalidadTorneo" class="form-select" required>
                                <option value="Solitario">Solitario (1v1)</option>
                                <option value="Grupal">Grupal (Equipos)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Torneo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-5 p-3 text-muted">
        <p>© 2026 GGspol Hub - Prototipo Etapa 1</p>
    </footer>

    <!-- Bootstrap JS y Scripts Propios -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
